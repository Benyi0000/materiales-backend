version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: craftiar_db
    environment:
      POSTGRES_USER: craftiar_user
      POSTGRES_PASSWORD: craftiar_password
      POSTGRES_DB: craftiar_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: craftiar_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: craftiar_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data:
